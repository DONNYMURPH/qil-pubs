[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qil-pubs"
version = "0.1.0"
description = "Track publications citing QIL-supported clinical trials by NCT number"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
qil-pubs = "qil_pubs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qil_pubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
