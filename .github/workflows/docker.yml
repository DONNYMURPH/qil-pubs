name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qil-pubs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is what lets GITHUB_TOKEN push to GHCR — no PAT needed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Don't publish an image whose tests fail.
      - name: Test
        run: |
          pip install -e '.[dev]'
          pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A v0.1.0 tag yields :0.1.0 and :0.1; main yields :main. Always a
          # :sha-<short> too, so a CronJob can pin something immutable.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The cluster is amd64 (6 nodes, RKE2). No arm64 build needed, and
          # building one on this runner would mean slow QEMU emulation.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "First push creates a **private** package. Make it public at" >> $GITHUB_STEP_SUMMARY
          echo "Packages -> qil-pubs -> Package settings -> Change visibility," >> $GITHUB_STEP_SUMMARY
          echo "or the cluster pull will fail with ImagePullBackOff." >> $GITHUB_STEP_SUMMARY
